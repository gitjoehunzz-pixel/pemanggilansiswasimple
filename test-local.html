<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 Local Stress Test - Offline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #1a1a2e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.top-bar {
  background: #16213e;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
.top-bar h1 { font-size: 1.1rem; }
.top-bar .badge {
  background: #e94560;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: .7rem;
  font-weight: 700;
}
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex: 1;
  overflow: hidden;
}
@media (max-width: 768px) {
  .main-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
.panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid #0f3460;
  overflow: hidden;
}
.panel:last-child { border-right: none; }
.panel-header {
  background: #16213e;
  padding: 10px 14px;
  font-weight: 700;
  font-size: .85rem;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-header .count { font-size: .7rem; color: #888; }
.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: .72rem;
  transition: all .15s;
}
.btn:active { transform: scale(.95); }
.btn-fire { background: #e94560; color: #fff; }
.btn-bulk { background: #f39c12; color: #fff; }
.btn-rapid { background: #e74c3c; color: #fff; }
.btn-clear { background: #333; color: #ccc; }
.btn-green { background: #27ae60; color: #fff; margin-left: 4px; }

.student-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.student-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  margin: 2px 0;
  background: #16213e;
  border-radius: 6px;
  border: 1px solid #1a3a5c;
  cursor: pointer;
  font-size: .78rem;
  transition: all .1s;
  gap: 6px;
}
.student-row:hover { background: #1e3a5c; border-color: #e94560; }
.student-row.called { background: #1a3a1a; border-color: #27ae60; opacity: .6; cursor: default; }
.student-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.student-row .cls { color: #888; font-size: .7rem; flex-shrink: 0; }

.queue-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.queue-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  margin: 2px 0;
  background: #2d1a00;
  border-radius: 6px;
  border: 1px solid #5c3a00;
  font-size: .78rem;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } }
.queue-item .name { flex: 1; }
.queue-item .cls { color: #f39c12; font-size: .7rem; }

.now-calling {
  background: #0d3a0d;
  border: 2px solid #27ae60;
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px;
  font-size: .85rem;
  font-weight: 700;
  color: #27ae60;
  display: none;
  flex-shrink: 0;
}
.now-calling.active { display: block; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

.controls {
  padding: 8px;
  border-top: 1px solid #0f3460;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.log-panel {
  height: 150px;
  flex-shrink: 0;
  border-top: 1px solid #0f3460;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.log-panel .panel-header { border-bottom: 1px solid #0f3460; }
.log-content {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  font-family: 'Consolas', monospace;
  font-size: .7rem;
  line-height: 1.5;
  background: #0d1117;
}
.log-content .ok { color: #3fb950; }
.log-content .warn { color: #d29922; }
.log-content .err { color: #f85149; }
.log-content .time { color: #8b949e; }

input[type=number] {
  width: 50px;
  padding: 4px 6px;
  border-radius: 4px;
  border: 1px solid #0f3460;
  background: #0d1117;
  color: #eee;
  font-size: .72rem;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🧪 Local Stress Test</h1>
  <span class="badge">OFFLINE</span>
  <span style="font-size:.7rem;color:#888">Simulasi queue lokal — gak nyentuh Firebase</span>
</div>

<div class="main-grid">
  <!-- LEFT: HP Simulator -->
  <div class="panel">
    <div class="panel-header">
      <span>📱 HP Simulator <span class="count" id="hpCount"></span></span>
      <div>
        <button class="btn btn-bulk" onclick="bulkCall()">💣 Bulk</button>
        <button class="btn btn-rapid" onclick="rapidFire()">⚡ Rapid</button>
      </div>
    </div>
    <div class="student-list" id="hpList"></div>
    <div class="controls">
      <span style="font-size:.7rem;color:#888">Bulk:</span>
      <input type="number" id="bulkCount" value="5" min="1" max="50">
      <span style="font-size:.7rem;color:#888">siswa</span>
      <span style="font-size:.7rem;color:#888;margin-left:8px">Rapid:</span>
      <input type="number" id="rapidCount" value="8" min="1" max="30">
      <span style="font-size:.7rem;color:#888">siswa</span>
      <span style="font-size:.7rem;color:#888">jeda:</span>
      <input type="number" id="rapidDelay" value="80" min="10" max="5000">
      <span style="font-size:.7rem;color:#888">ms</span>
      <button class="btn btn-clear" onclick="stopRapid()" id="btnStop" style="display:none">⏹ Stop</button>
    </div>
  </div>

  <!-- RIGHT: Computer Simulator -->
  <div class="panel">
    <div class="panel-header">
      <span>🖥 Komputer <span class="count" id="compCount"></span></span>
      <button class="btn btn-clear" onclick="clearAll()">🗑 Clear</button>
    </div>
    <div class="now-calling" id="nowCalling">🔊 Sedang Memanggil: <span id="nowCallingName"></span></div>
    <div class="queue-list" id="compQueue"></div>
    <div class="controls">
      <span style="font-size:.7rem;color:#888">Audio delay sim:</span>
      <input type="number" id="audioDelay" value="600" min="100" max="5000">
      <span style="font-size:.7rem;color:#888">ms (simulasi durasi audio)</span>
    </div>
  </div>
</div>

<!-- LOG -->
<div class="log-panel">
  <div class="panel-header">
    <span>📋 Event Log</span>
    <button class="btn btn-clear" onclick="clearLog()">🧹</button>
  </div>
  <div class="log-content" id="log"></div>
</div>

<script>
// ==================== STUDENT DATA ====================
const STUDENTS = [
  {name:"Abimana Praga Aksara", cls:"1 A", code:"1a"},
  {name:"Abinaya Keano Parasyad", cls:"1 A", code:"1a"},
  {name:"Ahmad Haidar Ali Darmawan", cls:"1 A", code:"1a"},
  {name:"Aiyra Al Lathiif", cls:"1 A", code:"1a"},
  {name:"Alira Attahiyya Albiruni", cls:"1 A", code:"1a"},
  {name:"Almeer Tsabtaqi Haaziq", cls:"1 A", code:"1a"},
  {name:"Areta Nirankara Suryadi", cls:"1 A", code:"1a"},
  {name:"Athmar Mahathir Hidayat", cls:"1 A", code:"1a"},
  {name:"Akleema Meysharuna Kinara", cls:"1 B", code:"1b"},
  {name:"Aldebaran Maliq Pramudya", cls:"1 B", code:"1b"},
  {name:"Almahyra Nafeeza Wiramsyah", cls:"1 B", code:"1b"},
  {name:"Alvarendra Oxy Pradipta", cls:"1 B", code:"1b"},
  {name:"Abyan Hadiyan Alghifari", cls:"2 A", code:"2a"},
  {name:"Adzra Naura Adnin", cls:"2 A", code:"2a"},
  {name:"Aisyah Jihan Fauziyah", cls:"2 A", code:"2a"},
  {name:"Aisyah Rahma Daniswara", cls:"2 A", code:"2a"},
  {name:"Atha Khalif Rahman", cls:"3 A", code:"3a"},
  {name:"Athaya Naura Alima", cls:"3 A", code:"3a"},
  {name:"Ayesha Kalila Putri", cls:"3 A", code:"3a"},
  {name:"Azka Maulana Yusuf", cls:"3 A", code:"3a"},
  {name:"Bianca Almira Putri", cls:"4 A", code:"4a"},
  {name:"Bima Sakti Pratama", cls:"4 A", code:"4a"},
  {name:"Brian Maulana Hakim", cls:"4 A", code:"4a"},
  {name:"Calista Ayu Ningrum", cls:"4 A", code:"4a"},
  {name:"Daffa Almer Putra", cls:"5 A", code:"5a"},
  {name:"Daniswara Putri", cls:"5 A", code:"5a"},
  {name:"Davin Mahesa Putra", cls:"5 A", code:"5a"},
  {name:"Dewi Safitri", cls:"5 A", code:"5a"},
  {name:"Elang Mahardika", cls:"6 A", code:"6a"},
  {name:"Erlangga Aditya", cls:"6 A", code:"6a"},
];

// ==================== SIMULATED QUEUE ====================
const queue = [];
let current = null;
let isPlaying = false;
const calledSet = new Set();

// ==================== LOG ====================
function log(msg, type='') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div><span class="time">[${time}]</span> <span class="${type}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

// ==================== RENDER HP ====================
function renderHP() {
  const el = document.getElementById('hpList');
  document.getElementById('hpCount').textContent = `(${STUDENTS.length} siswa)`;
  el.innerHTML = STUDENTS.map(s => {
    const called = calledSet.has(s.name);
    return `<div class="student-row${called ? ' called' : ''}" onclick="${called ? '' : `tapStudent('${s.name.replace(/'/g, "\\'")}')`}">
      <span class="name">${s.name}</span>
      <span class="cls">${s.cls}</span>
      ${called ? '<span style="color:#27ae60;font-size:.7rem">✓</span>' : '<span style="color:#e94560;font-size:.7rem">Tap</span>'}
    </div>`;
  }).join('');
}

// ==================== RENDER COMPUTER ====================
function renderComp() {
  const el = document.getElementById('compQueue');
  document.getElementById('compCount').textContent = queue.length > 0 ? `(${queue.length} antrian)` : '';
  
  if (queue.length === 0 && !current) {
    el.innerHTML = '<div style="text-align:center;color:#555;padding:30px;font-size:.8rem">Belum ada antrian</div>';
  } else {
    el.innerHTML = queue.map((s, i) => `
      <div class="queue-item">
        <span style="color:#888;margin-right:8px">#${i+1}</span>
        <span class="name">${s.name}</span>
        <span class="cls">${s.cls}</span>
      </div>
    `).join('');
  }
  
  // Now calling
  const nc = document.getElementById('nowCalling');
  const ncName = document.getElementById('nowCallingName');
  if (current) {
    nc.classList.add('active');
    ncName.textContent = current.name + ' (' + current.cls + ')';
  } else {
    nc.classList.remove('active');
  }
}

// ==================== TAP STUDENT (HP) ====================
function tapStudent(name) {
  const student = STUDENTS.find(s => s.name === name);
  if (!student) return;
  
  // Check duplicate
  if (queue.some(s => s.name === name)) {
    log(`⚠️ Duplicate ignored: ${name}`, 'warn');
    return;
  }
  if (current && current.name === name) {
    log(`⚠️ Already calling: ${name}`, 'warn');
    return;
  }
  
  // Add to queue
  queue.push({ ...student });
  calledSet.add(name);
  log(`📱 HP tap: ${name} (${student.cls}) → queue #${queue.length}`, 'ok');
  renderHP();
  renderComp();
  
  // Start processing if not already
  if (!isPlaying) processQueue();
}

// ==================== PROCESS QUEUE ====================
async function processQueue() {
  if (isPlaying) return;
  
  while (queue.length > 0) {
    isPlaying = true;
    current = queue.shift();
    log(`🔊 Playing: ${current.name} (${current.cls}) — queue left: ${queue.length}`, 'ok');
    renderHP();
    renderComp();
    
    // Simulate audio playback (2x)
    const audioDelay = parseInt(document.getElementById('audioDelay').value) || 600;
    await sleep(audioDelay);
    log(`  🔊 Play #1 done: ${current.name}`, '');
    await sleep(audioDelay);
    log(`  🔊 Play #2 done: ${current.name}`, '');
    
    current = null;
    renderHP();
    renderComp();
    
    // Small gap between students
    await sleep(200);
  }
  
  isPlaying = false;
  log(`✅ Queue empty, processor idle`, 'ok');
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ==================== BULK CALL ====================
function bulkCall() {
  const count = parseInt(document.getElementById('bulkCount').value) || 5;
  const available = STUDENTS.filter(s => !calledSet.has(s.name));
  const shuffled = [...available].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));
  
  log(`💣 BULK: Calling ${selected.length} students simultaneously`, 'warn');
  
  selected.forEach(s => {
    // Simulate all taps happening at the same time
    if (!queue.some(q => q.name === s.name) && (!current || current.name !== s.name)) {
      queue.push({ ...s });
      calledSet.add(s.name);
    }
  });
  
  renderHP();
  renderComp();
  log(`💣 BULK: ${selected.length} added to queue (total: ${queue.length})`, 'ok');
  
  if (!isPlaying) processQueue();
}

// ==================== RAPID FIRE ====================
let rapidRunning = false;
function rapidFire() {
  const count = parseInt(document.getElementById('rapidCount').value) || 8;
  const delay = parseInt(document.getElementById('rapidDelay').value) || 80;
  const available = STUDENTS.filter(s => !calledSet.has(s.name));
  const shuffled = [...available].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));
  
  rapidRunning = true;
  document.getElementById('btnStop').style.display = 'inline-block';
  log(`⚡ RAPID: ${selected.length} students, ${delay}ms gap`, 'warn');
  
  let i = 0;
  function fire() {
    if (!rapidRunning || i >= selected.length) {
      if (i >= selected.length) log(`✅ RAPID complete: ${i} calls`, 'ok');
      else log(`⏹ RAPID stopped at ${i}/${selected.length}`, 'warn');
      document.getElementById('btnStop').style.display = 'none';
      return;
    }
    tapStudent(selected[i].name);
    i++;
    setTimeout(fire, delay);
  }
  fire();
}

function stopRapid() {
  rapidRunning = false;
}

// ==================== CLEAR ====================
function clearAll() {
  queue.length = 0;
  current = null;
  isPlaying = false;
  calledSet.clear();
  renderHP();
  renderComp();
  log('🗑 All cleared', 'warn');
}

// ==================== INIT ====================
renderHP();
renderComp();
log('🧪 Local stress test ready (OFFLINE)', 'ok');
log('📋 ' + STUDENTS.length + ' students loaded', 'ok');
log('💡 Tap siswa di kiri, lihat queue di kanan', '');
</script>
</body>
</html>
