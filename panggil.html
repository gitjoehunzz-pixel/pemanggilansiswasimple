<meta charset="UTF-8">

<title>Panggil Siswa - SD Priangan Istiqamah</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f0f4f8;
  color: #202124;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
.header {
  background: linear-gradient(135deg, #0d47a1, #1565c0);
  color: #fff;
  padding: 10px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.header h1 { font-size: 1rem; font-weight: 700; }
.header p { font-size: .7rem; opacity: .85; }
.conn-status { font-size:.6rem; margin-top:2px; }
.conn-status.online { color:#a5d6a7; }
.conn-status.offline { color:#ef9a9a; }
.search-box {
  padding: 8px 12px;
  background: #fff;
  position: sticky;
  top: 62px;
  z-index: 9;
  border-bottom: 1px solid #e0e0e0;
}
.search-box input {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid #e0e0e0;
  border-radius: 24px;
  font-size: .9rem;
  outline: none;
  transition: border-color .2s;
}
.search-box input:focus { border-color: #1a73e8; }
.class-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.class-tabs::-webkit-scrollbar { display: none; }
.class-tab {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1.5px solid #e0e0e0;
  background: #fff;
  cursor: pointer;
  font-size: .72rem;
  font-weight: 500;
  white-space: nowrap;
  transition: all .15s;
  user-select: none;
}
.class-tab.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
.student-list {
  padding: 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding-bottom: 70px;
}
.student-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: .88rem;
  font-weight: 500;
  text-align: left;
  width: 100%;
  transition: all .1s;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  user-select: none;
}
.student-btn:active {
  background: #e8f0fe;
  transform: scale(.98);
}
.student-btn.in-queue {
  background: #fff3cd;
  border: 1.5px solid #ffc107;
}
.student-btn .cls-tag {
  font-size: .65rem;
  background: #e8f0fe;
  color: #1a73e8;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.student-btn .status-tag {
  font-size: .65rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.status-call { background: #e8f0fe; color: #1a73e8; }
.status-queue { background: #fff3cd; color: #b8860b; }
.status-current { background: #ff9800; color: #fff; }
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: .85rem;
  z-index: 999;
  animation: toastIn .3s ease, toastOut .3s ease 1.5s forwards;
  pointer-events: none;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(20px); } }
@keyframes toastOut { to { opacity:0; transform:translateX(-50%) translateY(20px); } }
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid #e0e0e0;
  padding: 8px 16px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  font-size: .72rem;
  font-weight: 600;
  z-index: 10;
}
.status-bar .stat { text-align: center; }
.status-bar .stat span { display: block; font-size: 1.1rem; color: #1a73e8; }
.empty { text-align:center; padding:30px; color:#aaa; font-size:.85rem; }
</style>
</head>

// ==================== FIREBASE STATE ====================
let queue = [];
let current = null;
let history = [];

// Listen to current
db.ref('current').on('value', snap => {
  current = snap.val();
  renderStatusBar();
  renderStudents();
});

// Listen to queue
db.ref('queue').on('value', snap => {
  queue = [];
  const data = snap.val();
  if (data) {
    Object.keys(data).forEach(key => {
      queue.push({ ...data[key], _fbKey: key });
    });
  }
  renderStatusBar();
  renderStudents();
});

// Listen to history
db.ref('history').on('value', snap => {
  history = [];
  const data = snap.val();
  if (data) {
    const now = Date.now();
    Object.keys(data).forEach(key => {
      if (data[key].expiresAt > now) {
        history.push({ ...data[key], _fbKey: key });
      }
    });
  }
  renderStatusBar();
});

// ==================== RENDER ====================
const classes = [...new Set(STUDENT_DATA.map(s => s.cls))];
let activeClass = 'all';
let searchQuery = '';

function renderTabs() {
  let html = '<button class="class-tab active" data-cls="all">Semua</button>';
  classes.forEach(cls => { html += `<button class="class-tab" data-cls="${cls}">Kls ${cls}</button>`; });
  document.getElementById('classTabs').innerHTML = html;
  document.querySelectorAll('.class-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.class-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeClass = tab.dataset.cls;
      renderStudents();
    });
  });
}

function isInQueue(name) { return queue.some(s => s.name === name); }
function isCurrent(name) { return current && current.name === name; }

function renderStudents() {
  let filtered = STUDENT_DATA;
  if (activeClass !== 'all') filtered = filtered.filter(s => s.cls === activeClass);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
  }
  
  let html = '';
  filtered.forEach(s => {
    let cls = '', status = 'status-call', statusText = 'Panggil';
    if (isCurrent(s.name)) { cls = 'in-queue'; status = 'status-current'; statusText = 'Dipanggil'; }
    else if (isInQueue(s.name)) { cls = 'in-queue'; status = 'status-queue'; statusText = 'Antri'; }
    html += `<button class="student-btn ${cls}" data-name="${s.name}">
      <span>${s.name}</span>
      <span class="status-tag ${status}">${statusText}</span>
    </button>`;
  });
  
  document.getElementById('studentList').innerHTML = html || '<div class="empty">Tidak ada siswa</div>';
  
  document.querySelectorAll('.student-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      if (isInQueue(name) || isCurrent(name)) {
        showToast('⚠️ Sudah dalam antrian');
        return;
      }
      const student = STUDENT_DATA.find(s => s.name === name);
      if (student) {
        // Push to Firebase
        const ref = db.ref('queue').push();
        ref.set({
          name: student.name,
          cls: student.cls,
          code: student.code,
          timestamp: Date.now()
        }).then(() => {
          console.log('✅ Pushed to Firebase:', student.name);
        }).catch(err => {
          console.error('❌ Firebase push failed:', err);
          showToast('❌ Gagal: ' + err.message);
        });
        showToast('✅ ' + student.name);
        if (navigator.vibrate) navigator.vibrate(50);
      }
    });
  });
}

function renderStatusBar() {
  document.getElementById('queueBadge').textContent = queue.length;
  document.getElementById('currentBadge').textContent = current ? current.name.split(' ')[0] : '-';
  document.getElementById('historyBadge').textContent = history.length;
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ==================== SEARCH ====================
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderStudents();
});

// ==================== INIT ====================
renderTabs();
renderStudents();
renderStatusBar();

console.log('📱 Panggil via Firebase siap!');
console.log('🔗 Project:', firebaseConfig.projectId);
