<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pemanggilan Siswa SD Priangan Istiqamah</title>
<style>
:root {
  --bg: #f0f4f8;
  --card: #fff;
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --accent: #e8a817;
  --danger: #d93025;
  --success: #0d904f;
  --text: #202124;
  --text-light: #5f6368;
  --border: #e0e0e0;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --radius: 10px;
  --radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.4;
}
/* Header */
.header {
  background: linear-gradient(135deg, #0d47a1, #1565c0);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #fff;
  background: #fff;
  flex-shrink: 0;
}
.header-title h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -.3px;
}
.header-title p {
  font-size: .8rem;
  opacity: .9;
  margin-top: 1px;
}
/* Main Layout */
.main-container {
  display: grid;
  grid-template-columns: 1fr 340px;
  grid-template-rows: 1fr auto;
  gap: 12px;
  padding: 12px;
  max-width: 1400px;
  margin: 0 auto;
  height: calc(100vh - 92px);
}
/* Student Panel */
.student-panel {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  grid-row: 1 / 3;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.panel-header h2 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--primary);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 320px;
}
.search-box input {
  flex: 1;
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 20px;
  font-size: .85rem;
  outline: none;
  transition: border-color .2s;
}
.search-box input:focus {
  border-color: var(--primary);
}
/* Class Tabs */
.class-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.class-tabs::-webkit-scrollbar { display: none; }
.class-tab {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1.5px solid #d0d7de;
  background: #f6f8fa;
  cursor: pointer;
  font-size: .78rem;
  font-weight: 600;
  white-space: nowrap;
  transition: all .15s;
  user-select: none;
  flex-shrink: 0;
  letter-spacing: -.01em;
}
.class-tab:hover { background: #e8f0fe; border-color: #90c2f0; }
.class-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 6px rgba(13,71,161,.3);
}
.class-tab[data-cls="all"] {
  background: #fff;
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 700;
}
.class-tab[data-cls="all"].active {
  background: var(--primary);
  color: #fff;
}
/* Student Grid */
.student-grid {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 6px;
  align-content: start;
}
.student-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: #fafafa;
  border-radius: var(--radius-sm);
  border: 1px solid #e0e0e0;
  cursor: pointer;
  transition: all .15s;
  gap: 8px;
  user-select: none;
}
.student-card:hover {
  background: #e8f0fe;
  border-color: #90c2f0;
}
.student-card.in-queue {
  background: #fff3cd;
  border-color: #ffc107;
  cursor: default;
}
.student-card.called {
  background: #d4edda;
  border-color: #7dcea0;
  cursor: default;
  opacity: .7;
}
.student-card .name {
  font-size: .82rem;
  font-weight: 500;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.student-card .badge {
  font-size: .65rem;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  flex-shrink: 0;
}
.badge-call { background: #e8f0fe; color: var(--primary); }
.badge-wait { background: #fff3cd; color: #b8860b; }
.badge-done { background: #d4edda; color: #0d6832; }
.badge-noaudio { background: #fce8e6; color: #c5221f; font-size: .6rem; }
/* Right Panel */
.right-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
/* Queue Panel */
.queue-panel {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 50%;
}
.queue-panel .panel-header {
  background: #fff8e1;
  border-bottom: 2px solid #ffc107;
}
.queue-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 60px;
}
.queue-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: #fff8e1;
  border-radius: var(--radius-sm);
  border: 1px solid #ffe082;
  font-size: .82rem;
  gap: 8px;
  animation: slideIn .2s ease;
}
.queue-item.current {
  background: #ff9800;
  color: #fff;
  border-color: #e65100;
  animation: pulse 1.5s infinite;
}
.queue-item .q-num {
  font-weight: 700;
  font-size: .9rem;
  min-width: 24px;
  text-align: center;
}
.queue-item .q-name {
  flex: 1;
  font-weight: 500;
}
.queue-item .q-remove {
  background: none;
  border: none;
  color: #999;
  cursor: pointer;
  font-size: 1.1rem;
  padding: 2px 6px;
  border-radius: 50%;
  line-height: 1;
  transition: all .15s;
}
.queue-item .q-remove:hover { color: #d93025; background: rgba(0,0,0,.05); }
.queue-item.current .q-remove { color: rgba(255,255,255,.7); }
.queue-item.current .q-remove:hover { color: #fff; background: rgba(255,255,255,.15); }
.queue-empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
  font-size: .82rem;
}
/* Now Calling */
.now-calling {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: 0 4px 16px rgba(255,152,0,.3);
  text-align: center;
  animation: glowPulse 2s infinite;
}
.now-calling .label {
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: .9;
}
.now-calling .calling-name {
  font-size: 1.3rem;
  font-weight: 700;
  margin-top: 2px;
}
.now-calling .calling-class {
  font-size: .75rem;
  opacity: .85;
}
/* History Panel */
.history-panel {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.history-panel .panel-header {
  background: #e8f5e9;
  border-bottom: 2px solid #4caf50;
}
.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.history-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: #f1f8e9;
  border-radius: var(--radius-sm);
  font-size: .8rem;
  animation: slideIn .2s ease;
}
.history-item .h-time {
  font-size: .68rem;
  color: #888;
  flex-shrink: 0;
}
.history-item .h-name {
  flex: 1;
  font-weight: 500;
}
.history-item .h-recall {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 3px 10px;
  border-radius: 12px;
  cursor: pointer;
  font-size: .7rem;
  font-weight: 600;
  transition: all .15s;
}
.history-item .h-recall:hover { background: var(--primary-dark); }
.history-item .h-timer {
  font-size: .68rem;
  color: #888;
  font-variant-numeric: tabular-nums;
  min-width: 52px;
  text-align: right;
  flex-shrink: 0;
}
.h-timer.blink {
  animation: timerBlink .5s infinite;
}
@keyframes timerBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
.history-group {
  margin-bottom: 2px;
}
.history-group-header {
  font-size: .72rem;
  font-weight: 700;
  color: var(--primary);
  padding: 6px 10px;
  background: #e8f0fe;
  border-radius: var(--radius-sm);
  margin-bottom: 2px;
  position: sticky;
  top: 0;
  z-index: 1;
}
/* Buttons */
.btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: none;
  font-weight: 600;
  font-size: .8rem;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
.btn-danger:hover { background: #fce8e6; }
.btn-sm { padding: 4px 12px; font-size: .72rem; }
/* Animations */
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,152,0,.4); }
  50% { box-shadow: 0 0 0 10px rgba(255,152,0,0); }
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 4px 16px rgba(255,152,0,.3); }
  50% { box-shadow: 0 4px 24px rgba(255,152,0,.5); }
}
/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
/* Responsive: narrow desktop */
@media (max-width: 900px) and (min-width: 769px) {
  .main-container {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    height: auto;
  }
  .student-panel { grid-row: auto; max-height: 50vh; }
  .right-panel { flex-direction: column; }
  .queue-panel { max-height: 30vh; }
}
/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: .85rem;
  font-weight: 500;
  z-index: 999;
  animation: toastIn .3s ease, toastOut .3s ease 2s forwards;
  pointer-events: none;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(20px); } }

/* ==================== RESPONSIVE: TABLET (landscape) ==================== */
@media (min-width: 401px) and (max-width: 768px) {
  .student-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 6px 10px;
  }
  .student-card .name { font-size: .82rem; white-space: normal; }
}

/* ==================== RESPONSIVE: MOBILE ==================== */
@media (max-width: 768px) {
  body {
    padding-bottom: 56px;
  }
  .header { flex-shrink: 0; }
  .main-container {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0;
    min-height: calc(100vh - 60px - 56px);
    height: auto;
  }
  .student-panel {
    flex: 1;
    border-radius: 0;
    display: none;
    min-height: 0;
  }
  .student-panel.active { display: flex; }
  .right-panel {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    min-height: 0;
  }
  .right-panel.active { display: flex; }
  .queue-panel { max-height: none; flex: 1; border-radius: var(--radius); }
  .history-panel { max-height: none; flex: 1; border-radius: var(--radius); }
  .now-calling { margin-bottom: 8px; }
  .student-grid {
    grid-template-columns: 1fr;
    gap: 4px;
    padding: 4px 8px;
    flex: 1;
    overflow-y: auto;
  }
  .student-card {
    padding: 12px 14px;
    border-radius: 8px;
    border-color: #d5d5d5;
  }
  .student-card .name {
    font-size: .85rem;
    white-space: normal;
    line-height: 1.3;
  }
  .student-card .badge {
    font-size: .7rem;
    padding: 3px 10px;
  }
  .header { padding: 8px 12px; }
  .header-logo { width: 40px; height: 40px; }
  .header-title h1 { font-size: 1rem; }
  .header-title p { font-size: .7rem; }
  .panel-header { padding: 8px 12px; }
  .panel-header h2 { font-size: .9rem; }
  .class-tabs { padding: 8px 10px; gap: 5px; flex-wrap: wrap; }
  .class-tab { padding: 6px 12px; font-size: .72rem; border-radius: 16px; }
  .search-box { max-width: none; }
  
  /* Mobile bottom nav */
  .mobile-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 2px solid var(--border);
    z-index: 200;
    box-shadow: 0 -2px 8px rgba(0,0,0,.08);
  }
  .mobile-nav-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: none;
    font-size: .7rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: all .15s;
  }
  .mobile-nav-btn .icon { font-size: 1.2rem; }
  .mobile-nav-btn.active { color: var(--primary); background: #e8f0fe; }
  .mobile-nav-btn .badge-dot {
    position: absolute;
    top: 4px;
    margin-left: 18px;
    background: var(--danger);
    color: #fff;
    font-size: .6rem;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
}

/* Desktop: hide mobile nav */
@media (min-width: 769px) {
  .mobile-nav { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
  <div class="header-title">
    <h1>Pemanggilan Siswa</h1>
    <p>SD Priangan Istiqamah</p>
  </div>
</div>

<!-- Main -->
<div class="main-container">
  <!-- Student Panel -->
  <div class="student-panel active" id="studentPanel">
    <div class="panel-header">
      <h2>📋 Daftar Siswa</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Cari siswa..." autocomplete="off">
      </div>
    </div>
    <div class="class-tabs" id="classTabs"></div>
    <div class="student-grid" id="studentGrid"></div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <!-- Queue Panel -->
    <div class="queue-panel" id="queuePanel">
      <div class="panel-header">
        <h2>⏳ Antrian <span id="queueCount" style="font-size:.75rem;color:#888">(0)</span></h2>
        <button class="btn btn-danger btn-sm" onclick="clearQueue()" title="Kosongkan antrian">✕ Hapus Semua</button>
      </div>
      <div class="queue-list" id="queueList">
        <div class="queue-empty">Belum ada antrian</div>
      </div>
      <div class="now-calling" id="nowCalling" style="display:none">
        <div class="label">🔊 Sedang Memanggil</div>
        <div class="calling-name" id="callingName"></div>
        <div class="calling-class" id="callingClass"></div>
      </div>
    </div>

    <!-- History Panel -->
    <div class="history-panel">
      <div class="panel-header">
        <h2>✅ History Terpanggil <span id="historyCount" style="font-size:.75rem;color:#888">(0)</span></h2>
        <button class="btn btn-danger btn-sm" onclick="clearHistory()">✕ Hapus</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="queue-empty">Belum ada siswa terpanggil</div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<div class="mobile-nav" id="mobileNav">
  <button class="mobile-nav-btn active" data-tab="siswa">
    <span class="icon">👨‍🎓</span> Siswa
  </button>
  <button class="mobile-nav-btn" data-tab="antrian">
    <span class="icon">⏳</span> Antrian
    <span class="badge-dot" id="mobileQueueBadge" style="display:none">0</span>
  </button>
  <button class="mobile-nav-btn" data-tab="history">
    <span class="icon">📝</span> History
  </button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
// ==================== FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyCe3wwUB88mfo15xhEIGin86x3PZYWNBmo",
  authDomain: "sdpi-bee96.firebaseapp.com",
  databaseURL: "https://sdpi-bee96-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sdpi-bee96",
  storageBucket: "sdpi-bee96.firebasestorage.app",
  messagingSenderId: "126328001169",
  appId: "1:126328001169:web:ce6abf97384425f2f8a530",
  measurementId: "G-V1QBXZLC2G"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
console.log('🔥 Firebase connected:', firebaseConfig.projectId);

// Debug: check connection
db.ref('.info/connected').on('value', snap => {
  if (snap.val() === true) {
    console.log('🔥 Firebase RTDB connected!');
  } else {
    console.warn('⚠️ Firebase RTDB disconnected');
  }
});

// ==================== FIREBASE LISTENERS ====================
// Track which Firebase keys we already have locally to avoid double-adds
const fbKeyMap = {}; // name -> fbKey

// Listen for new items in queue (from HP)
db.ref('queue').on('child_added', snap => {
  const student = snap.val();
  if (!student) return;
  const fbKey = snap.key;
  addToLocalQueue(student, fbKey);
});

// ==================== LOCAL TEST MODE (BroadcastChannel) ====================
// test-local.html broadcasts on this channel for offline testing
const testChannel = new BroadcastChannel('pemanggilan_test');
testChannel.onmessage = (e) => {
  const student = e.data;
  if (!student || !student.name) return;
  console.log('📥 Local test call:', student.name);
  addToLocalQueue(student, '_local_' + Date.now());
};

// ==================== LOCAL TEST MODE (WebSocket - Python tester.py) ====================
// Connect to tester.py WebSocket server for offline stress testing
(function initTestWebSocket() {
  try {
    const testWs = new WebSocket('ws://localhost:8765');
    testWs.onopen = () => {
      console.log('🧪 Test WebSocket connected (tester.py)');
      testWs.send(JSON.stringify({ type: 'hello' }));
    };
    testWs.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'call') {
        console.log('📥 Python test call:', data.name);
        addToLocalQueue(data, '_py_' + Date.now());
        testWs.send(JSON.stringify({ type: 'ack', name: data.name }));
      } else if (data.type === 'clear') {
        console.log('🧹 Python clear command');
        state.queue = [];
        state.current = null;
        state.isPlaying = false;
        if (state.audio) { state.audio.pause(); state.audio.remove(); state.audio = null; }
        saveState();
        refreshAll();
      }
    };
    testWs.onclose = () => console.log('🧪 Test WebSocket disconnected');
    testWs.onerror = () => {}; // Silently ignore (tester.py not running)
  } catch(e) {
    // Ignore — tester.py not running
  }
})();

// Shared helper: add student to queue from any source
function addToLocalQueue(student, sourceKey) {
  // Find matching student from our data
  const fullStudent = STUDENT_DATA.find(s => s.name === student.name);
  if (!fullStudent) return;
  
  // Check if already in local queue (avoid duplicates)
  if (state.queue.some(s => s.name === fullStudent.name)) return;
  if (state.current && state.current.name === fullStudent.name) return;
  
  // Add to local queue with source key
  const item = { ...fullStudent, _fbKey: sourceKey };
  state.queue.push(item);
  fbKeyMap[fullStudent.name] = sourceKey;
  saveState();
  renderQueue();
  renderStudents();
  console.log('📥 Queue:', fullStudent.name);
  if (!state.isPlaying) processQueue();
}

// Push to Firebase when computer calls a student locally
function pushToFirebaseQueue(student) {
  const ref = db.ref('queue').push();
  const fbKey = ref.key;
  ref.set({
    name: student.name,
    cls: student.cls,
    code: student.code,
    timestamp: Date.now()
  });
  fbKeyMap[student.name] = fbKey;
  return fbKey;
}

function removeFromFirebaseQueue(student) {
  const fbKey = fbKeyMap[student.name];
  if (fbKey) {
    db.ref('queue/' + fbKey).remove();
    delete fbKeyMap[student.name];
  }
}

function syncCurrentToFirebase(student) {
  if (student) {
    db.ref('current').set({ name: student.name, cls: student.cls, code: student.code, timestamp: Date.now() });
  } else {
    db.ref('current').remove();
  }
}

function syncHistoryToFirebase(student, expiresAt) {
  db.ref('history').push({
    name: student.name,
    cls: student.cls,
    code: student.code,
    timestamp: Date.now(),
    expiresAt: expiresAt
  });
}

// ==================== AUDIO MAPPING ====================
// Maps student name to audio file path
function getAudioFile(student) {
  // Convert name: lowercase, replace spaces & hyphens with underscores
  let key = student.name.toLowerCase()
    .replace(/ /g, '_')
    .replace(/-/g, '_');
  return 'audio/' + student.code + '_' + key + '.mp3';
}

// Pre-compute audio file paths and check existence
const audioCache = {};
function checkAudio(student) {
  if (audioCache[student.name] !== undefined) return audioCache[student.name];
  const path = getAudioFile(student);
  // We'll try to play and cache result on first attempt
  audioCache[student.name] = path;
  return path;
}

// Pre-compute all audio paths
STUDENT_DATA.forEach(s => { s.audioPath = getAudioFile(s); });

// ==================== STATE ====================
const state = {
  queue: [],           // Array of student objects in queue
  current: null,       // Currently calling student
  pausedStudent: null, // Student paused due to autoplay block
  isPlaying: false,    // Audio is playing
  history: [],         // Array of {student, time}
  activeClass: 'all',  // Active class filter
  searchQuery: '',     // Search query
  audio: null,         // Current Audio element
};

// ==================== RENDER ====================

// Get unique classes
const classes = [...new Set(STUDENT_DATA.map(s => s.cls))];

// Build class tabs
function renderTabs() {
  let html = '<button class="class-tab active" data-cls="all">Semua</button>';
  classes.forEach(cls => {
    html += `<button class="class-tab" data-cls="${cls}">Kelas ${cls}</button>`;

  // Click handlers
  classTabs.querySelectorAll('.class-tab').forEach(tab => {

      renderStudents();
      // Auto-scroll active tab into view
      tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  });
}

// Check if student is in queue
function isInQueue(student) {
  return state.queue.some(s => s.name === student.name);
}

// Check if student has been called (in history)
function isCalled(student) {
  return state.history.some(h => h.student.name === student.name);
}

// Get student status
function getStudentStatus(student) {
  if (state.current && state.current.name === student.name) return 'current';
  if (isInQueue(student)) return 'queue';
  return 'idle';
}

// Render student cards
function renderStudents() {
  let filtered = STUDENT_DATA;
  
  // Filter by class
  if (state.activeClass !== 'all') {
    filtered = filtered.filter(s => s.cls === state.activeClass);
  }
  
  // Filter by search
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
  }
  
  // Build HTML
  let html = '';
  filtered.forEach(s => {
    const status = getStudentStatus(s);
    let badge = '';
    let cardClass = '';
    
    if (status === 'current') {
      cardClass = 'in-queue';
      badge = '<span class="badge badge-wait">Dipanggil</span>';
    } else if (status === 'queue') {
      cardClass = 'in-queue';
      badge = '<span class="badge badge-wait">Antri</span>';
    } else {
      badge = '<span class="badge badge-call">Panggil</span>';
    }
    
    html += `<div class="student-card ${cardClass}" data-name="${s.name}" data-cls="${s.cls}">
      <span class="name">${s.name}</span>
      ${badge}
    </div>`;
  });
  
  studentGrid.innerHTML = html || '<div class="queue-empty" style="grid-column:1/-1">Tidak ada siswa</div>';
  
  // Click handlers
  studentGrid.querySelectorAll('.student-card').forEach(card => {
    card.addEventListener('click', () => {
      const name = card.dataset.name;
      const student = STUDENT_DATA.find(s => s.name === name);
      if (student) callStudent(student);
    });
  });
}

// Render queue
function renderQueue() {
  if (state.queue.length === 0 && !state.current) {
    queueList.innerHTML = '<div class="queue-empty">Belum ada antrian</div>';
  } else {
    let html = '';
    let num = 1;
    state.queue.forEach(s => {
      html += `<div class="queue-item">
        <span class="q-num">${num}</span>
        <span class="q-name">${s.name}</span>
        <span style="font-size:.7rem;color:#888">${s.cls}</span>
        <button class="q-remove" data-name="${s.name}" title="Hapus">✕</button>
      </div>`;
      num++;
    });
    queueList.innerHTML = html;
    
    // Remove buttons
    queueList.querySelectorAll('.q-remove').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeFromQueue(btn.dataset.name);
      });
    });
  }
  queueCount.textContent = `(${state.queue.length})`;
}

// Render history - grouped by class
function renderHistory() {
  if (state.history.length === 0) {
    historyList.innerHTML = '<div class="queue-empty">Belum ada siswa terpanggil</div>';
  } else {
    // Group by class
    const groups = {};
    state.history.forEach(h => {
      const cls = h.student.cls;
      if (!groups[cls]) groups[cls] = [];
      groups[cls].push(h);
    });
    // Sort class keys: 1A,1B,1C,2A,2B,2C,3A,3B,4A,4B,5A,5B,6
    const clsOrder = ['1 A','1 B','1 C','2 A','2 B','2 C','3 A','3 B','4A','4B','5A','5B','6'];
    const sortedKeys = Object.keys(groups).sort((a,b) => {
      const ai = clsOrder.indexOf(a), bi = clsOrder.indexOf(b);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });
    
    let html = '';
    sortedKeys.forEach(cls => {
      const entries = [...groups[cls]].reverse(); // newest first within group
      html += `<div class="history-group">
        <div class="history-group-header">📌 Kelas ${cls} <span style="font-weight:400;opacity:.7">(${entries.length})</span></div>`;
      entries.forEach(h => {
        html += `<div class="history-item" data-name="${h.student.name}">
          <span class="h-time">${h.time}</span>
          <span class="h-name">${h.student.name}</span>
          <span class="h-timer"></span>
          <button class="h-recall" data-name="${h.student.name}">Panggil Lagi</button>
        </div>`;
      });
      html += '</div>';
    });
    historyList.innerHTML = html;
    
    // Recall buttons
    historyList.querySelectorAll('.h-recall').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const name = btn.dataset.name;
        const student = STUDENT_DATA.find(s => s.name === name);
        if (student) callStudent(student);
      });
    });
  }
  historyCount.textContent = `(${state.history.length})`;
  // Show timers immediately
  if (state.history.length > 0) tickTimers();
}

}

// ==================== AUDIO ====================

function playAudio(student) {
  return new Promise((resolve) => {
    const audioPath = student.audioPath;
    
    const audio = new Audio();
    audio.preload = 'auto';
    
    const timeout = setTimeout(() => {
      audio.pause();
      audio.remove();
      resolve();
    }, 10000);
    
    const cleanup = () => {
      clearTimeout(timeout);
      audio.remove();
      resolve();
    };
    
    audio.onended = cleanup;
    
    audio.onerror = () => {
      clearTimeout(timeout);
      audio.remove();
      console.warn('Audio not found for:', student.name, audioPath);
      setTimeout(resolve, 500);
    };
    
    // Try to play
    audio.src = audioPath;
    audio.load();
    
    const tryPlay = () => {
      const promise = audio.play();
      if (promise && promise.catch) {
        promise.catch((err) => {
          console.warn('🔇 Autoplay blocked:', err.name);
          // Pause queue and show resume banner
          state.isPlaying = false;
          state.pausedStudent = state.current;
          state.current = null;
          clearTimeout(timeout);
          audio.remove();
          const banner = document.getElementById('resumeBanner');
          if (banner) banner.style.display = 'block';
          refreshAll();
          resolve();
        });
      }
    };
    
    audio.oncanplaythrough = tryPlay;
    
    // Fallback: if canplaythrough doesn't fire
    setTimeout(() => {
      if (!audio.ended && audio.paused && audio.readyState >= 2) {
        tryPlay();
      }
    }, 800);
    
    state.audio = audio;
  });
}

// ==================== QUEUE LOGIC ====================

function callStudent(student) {
  // Check if already in queue
  if (isInQueue(student)) {
    showToast('⚠️ Siswa sudah dalam antrian');
    return;
  }
  
  // Check if currently being called
  if (state.current && state.current.name === student.name) {
    showToast('⚠️ Siswa sedang dipanggil');
    return;
  }
  
  // Add to queue
  state.queue.push(student);
  saveState();
  pushToFirebaseQueue(student);
  renderQueue();
  renderStudents();
  
  showToast(`✅ ${student.name} masuk antrian`);
  
  // If not currently playing, start processing
  if (!state.isPlaying) {
    processQueue();
  }
}

function removeFromQueue(name) {
  const student = state.queue.find(s => s.name === name);
  state.queue = state.queue.filter(s => s.name !== name);
  saveState();
  if (student) removeFromFirebaseQueue(student);
  renderQueue();
  renderStudents();
  showToast('🗑️ Dihapus dari antrian');
}

function clearQueue() {
  if (state.queue.length === 0 && !state.current) return;
  if (!confirm('Yakin ingin mengosongkan antrian?')) return;
  
  // Stop current audio
  if (state.audio) {
    state.audio.pause();
    state.audio.remove();
    state.audio = null;
  }
  
  // Remove all from Firebase
  state.queue.forEach(s => removeFromFirebaseQueue(s));
  state.queue = [];
  state.current = null;
  state.isPlaying = false;
  saveState();
  syncCurrentToFirebase(null);
  refreshAll();
  showToast('🗑️ Antrian dikosongkan');
}

async function processQueue() {
  if (state.isPlaying) return;
  
  while (state.queue.length > 0) {
    state.isPlaying = true;
    state.current = state.queue.shift();
    saveState();
    
    // Sync to Firebase: set current, remove from queue
    syncCurrentToFirebase(state.current);
    removeFromFirebaseQueue(state.current);
    
    refreshAll();
    
    // Play audio 2x
    await playAudio(state.current);
    
    // If autoplay blocked, pause queue and wait for user click
    if (!state.isPlaying && state.pausedStudent) {
      saveState();
      refreshAll();
      return;
    }
    
    await playAudio(state.current);
    
    // Small delay between students so queue doesn't rush
    await new Promise(r => setTimeout(r, 400));
    
    // Move to history with auto-clear after 3 hours
    const now = new Date();
    const time = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const expiresAt = Date.now() + 10800000;
    const entry = {student: state.current, time, expiresAt};
    state.history.push(entry);
    saveState();
    
    // Sync to Firebase: clear current, add to history
    syncCurrentToFirebase(null);
    syncHistoryToFirebase(state.current, expiresAt);
    
    // Auto-remove from history after 3 hours
    setTimeout(() => {
      state.history = state.history.filter(h => h !== entry);
      saveState();
      refreshAll();
    }, 10800000);
    
    state.current = null;
    refreshAll();
  }
  
  state.isPlaying = false;
  state.audio = null;
}

function clearHistory() {
  if (state.history.length === 0) return;
  if (!confirm('Yakin ingin menghapus history?')) return;
  state.history = [];
  saveState();
  refreshAll();
  showToast('🗑️ History dihapus');
}

// ==================== PERSISTENCE (localStorage) ====================
const STORAGE_KEY = 'pemanggilan_siswa_sdpi';

function saveState() {
  const data = {
    queue: state.queue.map(s => s.name),
    history: state.history.map(h => ({ name: h.student.name, time: h.time, expiresAt: h.expiresAt }))
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const now = Date.now();
    
    // Restore queue
    if (data.queue) {
      state.queue = data.queue.map(name => STUDENT_DATA.find(s => s.name === name)).filter(Boolean);
    }
    // Restore history (only non-expired entries)
    if (data.history) {
      state.history = data.history
        .filter(h => h.expiresAt > now)
        .map(h => {
          const student = STUDENT_DATA.find(s => s.name === h.name);
          if (!student) return null;
          // Re-arm auto-clear timer
          const entry = { student, time: h.time, expiresAt: h.expiresAt };
          const remaining = h.expiresAt - now;
          setTimeout(() => {
            state.history = state.history.filter(e => e !== entry);
            saveState();
            refreshAll();
          }, remaining);
          return entry;
        })
        .filter(Boolean);
    }
  } catch(e) { localStorage.removeItem(STORAGE_KEY); }
}

// ==================== AUDIO UNLOCK (for browser autoplay policy) ====================
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  // Play silent audio to unlock audio context
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, 1, 22050);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(0);
  audioUnlocked = true;
  ctx.close();
  
  // Resume queue if waiting
  const banner = document.getElementById('resumeBanner');
  if (banner) banner.style.display = 'none';
  
  // Restore paused student (autoplay blocked earlier)
  if (state.pausedStudent) {
    state.queue.unshift(state.pausedStudent);
    state.pausedStudent = null;
  }
  
  if (state.queue.length > 0 && !state.isPlaying) {
    processQueue();
  }
}

// Tick history countdown every second (update timers only, no re-render)
setInterval(() => {
  if (state.history.length > 0) tickTimers();
}, 1000);

function tickTimers() {
  const now = Date.now();
  const items = historyList.querySelectorAll('.history-item');
  items.forEach(item => {
    const name = item.dataset.name;
    const entry = state.history.find(h => h.student.name === name);
    if (!entry) return;
    const remaining = Math.max(0, Math.ceil((entry.expiresAt - now) / 1000));
    const hrs = Math.floor(remaining / 3600);
    const min = Math.floor((remaining % 3600) / 60);
    const sec = remaining % 60;
    const timerStr = hrs > 0 ? hrs + ':' + String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0') : min + ':' + String(sec).padStart(2, '0');
    const timerEl = item.querySelector('.h-timer');
    if (timerEl) {
      timerEl.textContent = '⏱ ' + timerStr;
      if (remaining <= 10) {
        timerEl.style.color = '#d93025';
        timerEl.style.fontWeight = '700';
        timerEl.classList.add('blink');
      } else {
        timerEl.style.color = '#888';
        timerEl.style.fontWeight = 'normal';
        timerEl.classList.remove('blink');
      }
    }
  });
}
